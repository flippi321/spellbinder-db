<!-- Sent after a password change, so a takeover doesn't go unnoticed. -->
<div style="margin:0;padding:32px 16px;background:#0B0A0F;font-family:Helvetica,Arial,sans-serif;color:#EEE8DA;">
  <div style="max-width:440px;margin:0 auto;background:#16141C;border:1px solid #2A2633;border-radius:16px;padding:32px 28px;">
    <p style="margin:0 0 4px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#D4AF6A;">Spellbinder</p>
    <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:24px;font-weight:normal;color:#EEE8DA;">Your password was changed</h1>
    <p style="margin:0;font-size:15px;line-height:1.5;color:#CFC8B8;">
      The password for {{ .Email }} was just changed. If that wasn't you, tell the group admin right away so they can lock the account.
    </p>
  </div>
</div>
